[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "extractrs"
version = "0.1.0"
description = "Fast exact zonal statistics for xarray — powered by Rust"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "xarray",
    "geopandas",
]

[project.optional-dependencies]
rio = ["rioxarray"]

[tool.maturin]
python-source = "python"
module-name = "extractrs._extractrs"
features = ["pyo3/extension-module"]
