[package]
name = "extractrs-pipeline"
description = "Zonal statistics pipeline: Daymet × MERIT basins"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "extractrs-pipeline"
path = "src/main.rs"

[[example]]
name = "validate"
path = "../../validation/run_extractrs.rs"

[dependencies]
extractrs-core = { path = "../extractrs-core" }
extractrs-stats = { path = "../extractrs-stats" }
extractrs-io = { path = "../extractrs-io" }
ndarray = "0.17"
chrono = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
csv = "1"
