[project]
site_name = "extractrs"
site_description = "Fast exact zonal statistics for xarray — powered by Rust"
site_author = "Tadd Bindas"
site_url = "https://deepgroundwater.com/extractrs"
repo_url = "https://github.com/DeepGroundwater/extractrs"
repo_name = "DeepGroundwater/extractrs"
docs_dir = "docs"

[project.theme]
language = "en"
features = [
    "content.code.copy",
    "content.code.annotate",
    "navigation.footer",
    "navigation.top",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "orange"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings]

[project.plugins.mkdocstrings.handlers.python]
paths = ["extractrs-python/python"]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = true
show_root_heading = true
docstring_style = "numpy"
